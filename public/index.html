<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Based Race</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; touch-action: none; }
    #game-container { width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; }
    #game-canvas { width: 100% !important; height: 100% !important; display: block; object-fit: contain; background: #000; }
    #back-btn {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Press Start 2P', cursive;
      background-color: #e7f2eb; color: #0f10f4;
      border: none; padding: 15px 20px; font-size: clamp(10px, 2.5vw, 14px);
      cursor: pointer; box-shadow: 4px 4px 0 0 #233e63, 6px 6px 0 0 #99b1c5;
      z-index: 100;
    }
    #back-btn:active { transform: translate(-50%, -50%) translate(4px, 4px); box-shadow: 0 0 0 0 #233e63, 2px 2px 0 0 #99b1c5; }
    #winner-text {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Press Start 2P', cursive; font-size: clamp(20px, 5vw, 40px);
      font-weight: bold; color: #FFD700;
      text-shadow: 0 0 20px #FFD700, 0 0 40px #FF6B00;
      white-space: nowrap; z-index: 100;
    }
    #debugger {
        position: fixed;
        top: 10px;
        right: 10px;
        background-color: rgba(0,0,0,0.7);
        color: white;
        padding: 10px;
        font-family: 'Press Start 2P', cursive;
        font-size: 10px;
        z-index: 101;
    }
    #debugger .lane {
        margin-bottom: 5px;
    }
    #debugger input {
        width: 50px;
        background-color: #333;
        color: white;
        border: 1px solid #555;
    }
    #debugger button {
        background-color: #555;
        color: white;
        border: none;
        padding: 5px;
        margin-top: 10px;
        font-family: 'Press Start 2P', cursive;
        cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    <button id="back-btn" style="display: none;">Back to Menu</button>
    <div id="winner-text" style="display: none;"></div>
  </div>

  <div id="debugger">
      <div class="lane">
          Lane 1:
          X: <input type="number" id="lane1-x" value="-80">
          Y: <input type="number" id="lane1-y" value="-30">
      </div>
      <div class="lane">
          Lane 2:
          X: <input type="number" id="lane2-x" value="190">
          Y: <input type="number" id="lane2-y" value="160">
      </div>
      <div class="lane">
          Lane 3:
          X: <input type="number" id="lane3-x" value="490">
          Y: <input type="number" id="lane3-y" value="320">
      </div>
      <div class="lane">
          Lane 4:
          X: <input type="number" id="lane4-x" value="790">
          Y: <input type="number" id="lane4-y" value="550">
      </div>
      <button id="print-coords">Print Coordinates</button>
  </div>

  <script type="module" src="/js/main.js"></script>
  <script>
    document.getElementById('back-btn').addEventListener('click', () => {
      // Send a message instead of reloading for a smoother experience
      window.parent.postMessage({ type: 'raceState', state: 'finished' }, '*');
    });
  </script>
</body>
</html>
